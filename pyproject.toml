[project]
name = "tx_mixed_beverages"
version = "0.0.0"
description = "Texas Mixed Beverage Gross Receipts Tax data"
authors = []
license = {text = "Apache-2.0"}
requires-python = ">=3.15"
dependencies = [
    "Django>=6.1",
    "dj-database-url>=3.1",
    "psycopg[binary]>=3.2",
    "project-runpy>=1.1",
    "django-extensions>=4.1",
    "requests>=2.34",
    "django-geojson>=4.2",
    "dj-obj-update>=0.6",
    "python-dotenv>=1.2",
]

[tool.uv]
exclude-newer = "3 days"

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "tqdm>=4.70",
    "ipdb>=0.13",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.ruff]
extend-exclude = ["migrations"]

[tool.ruff.lint]
extend-select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "G",   # flake8-logging-format
  "I",   # isort
  "N",   # pep8-naming
  "RET", # flakes8-return
  "RUF", # Ruff-specific rules
  "UP",  # pyupgrade
  "PLC", # pylint conventions
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations/"]
